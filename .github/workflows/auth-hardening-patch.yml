name: One-time auth hardening patch
on:
  push:
    branches: [fieldops-v4]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'eng540'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch refresh rotation response and cookie scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/modules/iam/router.py')
          s = p.read_text()
          s = s.replace('path="/auth/refresh",', 'path="/api/v1/auth/refresh",')
          s = s.replace('''    return {\n        "access_token": access_token_str,\n        "expires_in": settings.ACCESS_TOKEN_EXPIRE_MINUTES * 60,\n    }''', '''    return {\n        "access_token": access_token_str,\n        "expires_in": settings.ACCESS_TOKEN_EXPIRE_MINUTES * 60,\n        "refresh_token": new_refresh_token_str,\n    }''')
          s = s.replace('response.delete_cookie(key="refresh_token", path="/auth/refresh")', 'response.delete_cookie(key="refresh_token", path="/api/v1/auth/refresh")')
          p.write_text(s)
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          rm -f .github/workflows/auth-hardening-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/modules/iam/router.py .github/workflows/auth-hardening-patch.yml
          git diff --cached --quiet || git commit -m 'fix(auth): complete refresh token rotation contract'
          git push
