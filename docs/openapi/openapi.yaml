openapi: 3.0.3
info:
  title: FieldOps SaaS V4.0 API
  version: 4.0.0-sprint0
  description: |
    Multi-Tenant Offline-First Field Operations Platform.

    ## Constitutional Principles
    - **Multi-Tenant Isolation:** Every request carries `org_id` + `project_scope` + `role_scope`
    - **Server-Reconciled State:** Sync ≠ Truth. The server is the absolute source of truth.
    - **Monotonic Progress:** Progress cannot decrease without Rework Flag + Justification + Audit.
    - **Exactly-Once Sync:** `operation_uuid` + `processed_operations` registry.
    - **Explainable Governance:** Every decision returns `{decision, matched_rule, reason, policy_version}`.

    ## Authentication
    Short-lived JWT (15 min) + HttpOnly Refresh Token (7 days, rotated).
    JWT carries identity only; full authorization is server-side.
  contact:
    name: FieldOps Architecture Team
    email: arch@fieldops.dev
  license:
    name: Proprietary
    url: https://fieldops.dev/license

servers:
  - url: http://localhost:8000
    description: Local Development
  - url: https://api-staging.fieldops.dev
    description: Staging Environment
  - url: https://api.fieldops.dev
    description: Production Environment

# ─────────────────────────────────────────
# SECURITY
# ─────────────────────────────────────────
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived access token (15 minutes). 
        Include in Authorization header: `Bearer <token>`

    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly secure cookie for refresh token rotation.

  schemas:
    # ─────────────────────────────────────
    # ERROR MODELS
    # ─────────────────────────────────────
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Invalid request parameters"
        details:
          type: object
          nullable: true

    # ─────────────────────────────────────
    # AUTH MODELS
    # ─────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password, device_public_key]
      properties:
        email:
          type: string
          format: email
          example: "engineer@nrc.org"
        password:
          type: string
          format: password
          minLength: 8
          example: "SecurePass123!"
        device_public_key:
          type: string