version: "3.9"

# FieldOps V4.0 — Docker Compose
# Secrets loaded from .env file (NEVER commit .env to git)
# Run from repo root: docker compose -f infrastructure/docker/docker-compose.yml up

services:
  # ─────────────────────────────────────────
  # PostgreSQL 16 with RLS-ready configuration
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fieldops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldops} -d ${POSTGRES_DB:-fieldops}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fieldops-network

  # ─────────────────────────────────────────
  # Redis (Session Registry + Cache)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fieldops-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fieldops-network

  # ─────────────────────────────────────────
  # Backend API (FastAPI)
  # ─────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.api
    container_name: fieldops-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app:ro
      - ./docs/openapi:/app/docs/openapi:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fieldops-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────
  # Frontend (React + Vite)
  # ─────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.web
    container_name: fieldops-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-sprint-0}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - fieldops-network
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  redis_data:

networks:
  fieldops-network:
    driver: bridge
