[tool.poetry]
name = "fieldops-backend"
version = "4.0.0"
description = "FieldOps SaaS V4.0 -- Modular Monolith Backend"
authors = ["FieldOps Architecture Team <arch@fieldops.dev>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.13"
pydantic = "^2.7"
pydantic-settings = "^2.2"
python-jose = {extras = ["cryptography"], version = "^3.3"}
bcrypt = ">=3.2.0"
python-multipart = "^0.0.9"
aioboto3 = "^13.0"
redis = "^5.0"
httpx = "^0.27"
structlog = "^24.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
httpx = "^0.27"
factory-boy = "^3.3"
freezegun = "^1.5"
mypy = "^1.10"
ruff = "^0.4"
black = "^24.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "N", "C4"]
ignore = [
    "E501",
    "E702",
    "E701",
    "F401",
    "F841",
    "I001",
    "UP017",
    "UP035",
    "UP038",
    "B008",
    "B904",
    "SIM102",
    "SIM108",
    "SIM114",
    "SIM201",
    "W291",
    "W292",
    "W293",
]

[tool.ruff.lint]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-x --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
